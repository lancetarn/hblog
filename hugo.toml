baseURL = "http://blog.lancetarn.com/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Blog@Lancetarn"
# theme = "hermit-v2"
theme = "hermit-v2"
# enableGitInfo = true
pygmentsCodefences  = true
pygmentsUseClasses  = true
# hasCJKLanguage = true  # If there're Chinese/Japanese/Korean Languages in the content, enable this.
rssLimit = 10  # Maximum number of items in the RSS feed.
copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License." # This message is only used by the RSS template.
enableEmoji = true  # Shorthand emojis in content files - https://gohugo.io/functions/emojify/
# googleAnalytics = "UA-131503229-1"
# disqusShortname = "yourdiscussshortname"
footerHideThemeName = true


[blackfriday]
  # hrefTargetBlank = true

[taxonomies]
  tag = "tags"
  # category = ""  # Categories are disabled by default.

[frontmatter]
    date = ["lastmod", "date", "publishDate"]
    lastmod = ["date", "lastmod", ":git", "publishDate"]
    publishDate = ["publishDate", "date"]
    expiryDate = ["expiryDate"]

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04 -0700"

  # themeColor = "#494f5c"  # Theme color in meta tags.
  homeSubtitle = "Software and Other Delights"
  footerCopyright = ' &#183; <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
  # gitUrl = "https://github.com/Someone/SomeRepo/commit/" # Prefix of link to the git commit detail page. GitInfo must be enabled.
  justifyContent = false  # Set "text-align: justify" to .content, requires extended version of Hugo
  # bgImg = ""  #  Homepage background-image URL
  relatedPosts = true
  code_copy_button = true


  # Social Icons
  # Check https://github.com/Track3/hermit#social-icons for more info.
  # [[params.social]]
  #   name = "twitter"
  #   url = "https://twitter.com/"

  # [[params.social]]
  #   name = "instagram"
  #   url = "https://instagram.com/"
[params.author]
  name = "Lance Tarn Erickson"
# [author]
#   name = "Lance Tarn Erickson"

  [[params.socialLinks]]
    name = "github"
    url = "https://github.com/lancetarn/"

[menu]

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 20
